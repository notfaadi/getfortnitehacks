# Cloudflare Worker + static assets (CI: build then `npx wrangler deploy`).
# Attach getfortnitehacks.org under Workers → getfortnitehacks → Settings → Domains & Routes.
# Do not declare [[routes]] here unless the zone is on this Cloudflare account.
name = "getfortnitehacks"
main = "workers/site.js"
compatibility_date = "2026-09-12"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
