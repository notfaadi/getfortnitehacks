# Cloudflare Worker + static assets (CI: build then `npx wrangler deploy`).
# Public site URL: https://getfortnitehacks.org only (not workers.dev, not .io).
name = "getfortnitehacks"
main = "workers/site.js"
compatibility_date = "2026-09-12"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "getfortnitehacks.org/*"
zone_name = "getfortnitehacks.org"

[[routes]]
pattern = "www.getfortnitehacks.org/*"
zone_name = "getfortnitehacks.org"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
