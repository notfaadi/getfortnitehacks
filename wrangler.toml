# Cloudflare Worker + static assets (CI: build then `npx wrangler deploy`).
# Public site URL: https://getfortnitehacks.org only (not workers.dev, not .io).
# Seobility www→apex: add www CNAME + custom domain — docs/CLOUDFLARE-WWW.md
name = "getfortnitehacks"
main = "workers/site.js"
compatibility_date = "2026-09-12"
workers_dev = false
preview_urls = false

# Custom domains (Wrangler creates/attaches DNS for www when the zone is on your account).
[[routes]]
pattern = "getfortnitehacks.org"
custom_domain = true

[[routes]]
pattern = "www.getfortnitehacks.org"
custom_domain = true

# Optional — only after getfortnitehacks.io is added to Cloudflare (DNS → orange cloud).
# Worker will 301 all .io traffic to https://getfortnitehacks.org (see workers/site.js).
# [[routes]]
# pattern = "getfortnitehacks.io/*"
# zone_name = "getfortnitehacks.io"
# [[routes]]
# pattern = "www.getfortnitehacks.io/*"
# zone_name = "getfortnitehacks.io"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
